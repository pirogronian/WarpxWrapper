[project]
name = "WarpxWrapper"
dependencies = ["blessed", "pypsutil", "regex"]
version = "1.0-rc"
authors = [
    { name = "Łukasz Buczyński", email = "lukasz.a.buczynski@gmail.com" }
]
keywords = [ "wrapper", "warpx", "helper" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Utilities"
]

[project.scripts]
WarpxWrapper = "WarpxWrapper.Main:main"

[project.urls]
"Source code" = "https://github.com/pirogronian/WarpxWrapper"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
